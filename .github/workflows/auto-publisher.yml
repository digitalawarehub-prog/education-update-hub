name: Education Update Hub Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: education-update-hub-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validate Python files
        run: |
          python -m compileall -q bot

      - name: Run AI Auto Publisher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          MAX_AI_POSTS_PER_RUN: "5"
          EUH_GENERIC_DETAIL_CAP: "2"
          EUH_DETAIL_QUEUE_CAP: "16"
          EUH_DETAIL_WORKERS: "4"
          EUH_DETAIL_MAX_PAGES: "2"
          EUH_DETAIL_MAX_DEPTH: "1"
          EUH_DETAIL_TIME_BUDGET: "10"
          EUH_MAX_PDF_PAGES: "8"
          EUH_OCR_MAX_PAGES: "2"
        run: python bot/run_v17.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database generated index.html *.html sitemap.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 AI publisher update"
          git push
