name: Education Update Hub Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: auto-publisher
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Hindi/scan PDFs need Tesseract as a fallback. Normal text PDFs still
      # use PyMuPDF/pdfplumber first, so OCR is not run unless extraction quality
      # is actually poor.
      - name: Install OCR Fallback
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Run V17 Publisher
        timeout-minutes: 25
        env:
          EUH_DETAIL_QUEUE_CAP: "16"
          EUH_DETAIL_WORKERS: "4"
          EUH_DETAIL_MAX_PAGES: "2"
          EUH_DETAIL_MAX_DEPTH: "1"
          EUH_DETAIL_TIME_BUDGET: "14"
          EUH_MAX_PDF_PAGES: "8"
          EUH_OCR_MAX_PAGES: "2"
          EUH_LEGACY_REPAIR_CAP: "8"
          EUH_ENABLE_OCR: "true"
        run: python -u bot/run_v17.py

      - name: Remove generated Python cache files
        if: always()
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Commit & Push Changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "🤖 V17 Auto Update"
          git push origin HEAD:main
