name: Education Update Hub Auto Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
concurrency:
  group: euh-auto-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run publisher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          MAX_AI_POSTS_PER_RUN: "5"
        run: python bot/monitor_ai.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated index.html latest-jobs.html result.html admit-card.html answer-key.html syllabus.html entrance-exams.html scholarship.html teaching-exams.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 AI category-wise update"
          git push
