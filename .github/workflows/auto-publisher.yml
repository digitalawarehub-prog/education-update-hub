name: Education Update Hub Auto Publisher

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: education-update-hub-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    timeout-minutes: 18

    env:
      EHU_SOURCE_BATCH_SIZE: 40
      EHU_SOURCE_WORKERS: 6
      EHU_REQUEST_TIMEOUT: 15
      EHU_MAX_RETRIES: 2
      EHU_SOURCE_TIMEOUT: 30

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-hin \
            poppler-utils \
            psutil

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Auto Publisher
        run: |
          echo "=========================================="
          echo " EDUCATION UPDATE HUB AUTO PUBLISHER"
          echo "=========================================="
          echo "Batch Size       : $EHU_SOURCE_BATCH_SIZE"
          echo "Workers          : $EHU_SOURCE_WORKERS"
          echo "Request Timeout  : $EHU_REQUEST_TIMEOUT sec"
          echo "Max Retries      : $EHU_MAX_RETRIES"
          echo "Source Timeout   : $EHU_SOURCE_TIMEOUT sec"
          echo "Workflow Timeout : 12 min"
          echo "=========================================="

          python bot/scraper.py

      - name: Show generated files
        if: always()
        run: |
          echo "========== GENERATED FILES =========="
          find . -maxdepth 3 -type f \
            \( -name "*.html" -o -name "*.json" -o -name "*.xml" \) \
            -print | head -100

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "Education Update Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update jobs and posts"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
