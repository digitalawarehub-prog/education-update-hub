name: Education Update Hub Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: auto-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync with latest main BEFORE generation
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e .gitignore

      - name: Remove generated Python cache files
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Install OCR Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Monitor
        env:
          EHU_SOURCE_BATCH_SIZE: 80
          EHU_SOURCE_WORKERS: 6
          EHU_REQUEST_TIMEOUT: 15
          EHU_READ_TIMEOUT: 20
          EHU_MAX_RETRIES: 1
          EHU_SSL_FALLBACK: 1
          EHU_SOURCE_ROTATION_MINUTES: 30
        run: |
          python bot/monitor.py


      - name: Remove duplicate instruction files
        run: |
          # Keep the single README.md; remove old troubleshooting/replacement notes
          # that accumulated from previous manual uploads.
          find . -maxdepth 1 -type f \
            \( -name 'REPLACE*.txt' -o -name 'README-*.md' -o -name 'README_*.txt' -o -name 'UPLOAD-TO-GITHUB*.txt' \) -delete
          find bot -maxdepth 1 -type f \
            \( -name 'README-*.md' -o -name 'README_*.txt' \) -delete 2>/dev/null || true

      - name: Remove generated Python cache files before commit
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🤖 Auto Update"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push attempt $i failed; syncing and retrying..."
            git fetch origin main
            git rebase origin/main || exit 1
          done

          echo "Push failed after 3 attempts."
          exit 1
