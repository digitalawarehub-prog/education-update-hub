name: Education Update Hub Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: auto-publisher
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Sync with latest main BEFORE generation
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git clean -fd -e .gitignore

      - name: Install OCR fallback only when missing
        shell: bash
        run: |
          set -e
          LANG_PACKS="tesseract-ocr-hin tesseract-ocr-tam tesseract-ocr-tel tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-kan tesseract-ocr-mal tesseract-ocr-mar tesseract-ocr-pan tesseract-ocr-ori"
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr $LANG_PACKS
          tesseract --list-langs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Remove generated Python cache files
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Run Monitor
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -u bot/monitor.py

      - name: Remove generated Python cache files before commit
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 Auto Update V20"
          git push origin HEAD:main
