name: Education Update Hub Auto Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: education-update-hub-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EHU_SOURCE_BATCH_SIZE: 40
      EHU_SOURCE_WORKERS: 6
      EHU_REQUEST_TIMEOUT: 8
      EHU_MAX_ENRICH_PER_SOURCE: 12
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin poppler-utils
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install psutil
      - name: Verify environment
        run: |
          python - <<'PY'
          import psutil,sys
          print("Python:",sys.version)
          print("psutil:",psutil.__version__)
          PY
          tesseract --version | head -1
      - name: Run Auto Publisher
        run: python bot/monitor.py
      - name: Remove Python cache
        if: always()
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit & Push Changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🤖 Auto Update"
          git push origin HEAD:main
